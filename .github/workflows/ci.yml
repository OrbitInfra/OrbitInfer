name: CPU foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build the binding and install CPU test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Check source, Rust, Python and installed wheel
        run: uv run --no-sync python scripts/check.py
      - name: Repeat storage and CPU fixture controls
        run: |
          for iteration in $(seq 1 50); do
            echo "CPU owner/fixture repetition $iteration/50"
            uv run --no-sync python -m pytest -q tests/test_cache_retirement.py \
              tests/test_distributed_http.py::test_rank_fixture_joins_watcher_before_destroying_process_groups \
              tests/test_deepseek_auxiliary_graphs.py::test_auxiliary_callbacks_bind_model_projections_and_preserve_output_dtypes \
              models/cuda/tests/test_deepseek_v41_projections.py::test_prepared_vocab_head_preserves_last_row_full_logits_and_fp32_output
          done
