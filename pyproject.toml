[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "orbitinfer"
version = "0.1.0.dev1"
description = "NVIDIA inference runtime with Rust scheduling and explicit resource ownership"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/resin/NOTICE", "crates/orbitinfer-recipe/licenses/*.txt"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Rust", "Programming Language :: Python :: 3"]
dependencies = ["blake3>=1.0,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
cuda = [
  "torch==2.13.0",
  "flashinfer-python==0.7.1; sys_platform == 'linux'",
  "cuda-bindings>=13.3,<14; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.6.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl-libs-base==4.6.2; sys_platform == 'linux'",
  "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
  "quack-kernels==0.6.4; sys_platform == 'linux'",
]

[dependency-groups]
test = [
  "pytest>=8,<9", "hypothesis>=6.140,<7", "maturin>=1.9,<2",
  "torch==2.13.0", "pillow>=10", "safetensors>=0.5",
  "huggingface-hub>=0.35", "transformers==5.14.1",
  "tml-renderers==0.2.0", "renderers==0.1.9",
  "deepseek-recipe==0.2.0", "openai-harmony==0.0.8",
  "matplotlib>=3.10,<4", "ruff>=0.16,<0.17",
]

[tool.maturin]
manifest-path = "crates/orbitinfer-py/Cargo.toml"
module-name = "orbitinfer._native"
python-source = "."
python-packages = ["orbitinfer"]
features = ["pyo3/extension-module"]
include = [{ path = "orbitinfer/backend/cuda/sampling_topk.cu", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
pythonpath = [".", "models/cuda"]
testpaths = ["tests", "models/cuda/tests"]

[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID252"]
[tool.ruff.lint.per-file-ignores]
"orbitinfer/_native.pyi" = ["I001"]
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
[tool.ruff.lint.isort]
known-first-party = ["orbitinfer", "orbitinfer_models_cuda"]

[tool.uv]
default-groups = []
override-dependencies = [
  "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.6.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl-libs-base==4.6.2; sys_platform == 'linux'",
]
