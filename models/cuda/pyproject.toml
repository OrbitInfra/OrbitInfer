[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "orbitinfer-models-cuda"
version = "0.1.0.dev1"
description = "DeepSeek NVIDIA runner for OrbitInfer"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "orbitinfer_models_cuda/deepseek_v41/LICENSE", "orbitinfer_models_cuda/deepseek_v41/upstream/LICENSE"]
dependencies = [
  "orbitinfer[cuda]==0.1.0.dev1",
  "huggingface-hub>=0.35", "pillow>=10", "safetensors>=0.5", "transformers==5.14.1",
  # Preserve the audited upstream kernel stack; changing it needs numerical tests.
  "torch==2.13.0", "torchvision==0.28.0",
  "triton==3.7.1; sys_platform == 'linux'",
  "tilelang==0.1.14; sys_platform == 'linux'",
  "flashinfer-python==0.7.1; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.6.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl-libs-base==4.6.2; sys_platform == 'linux'",
  "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
  "quack-kernels==0.6.4; sys_platform == 'linux'",
  "deep-gemm==2.8.2; sys_platform == 'linux'",
  "deep-select==1.0.0; sys_platform == 'linux'",
  "flash-mla==1.0.0; sys_platform == 'linux'",
  "tile-kernels==1.0.0; sys_platform == 'linux'",
]
[tool.uv.sources]
orbitinfer = { path = "../.." }
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", rev = "1fc9c66975ee322d628b3288534ca0e9ce12a64d" }
deep-select = { git = "https://github.com/deepseek-ai/DeepSelect", rev = "bfa4507d935f17ebfc3d0f00ff7d3c9a4d0e5c18" }
flash-mla = { git = "https://github.com/deepseek-ai/FlashMLA", rev = "2e5429fc5653bab6e081f09477126f731882a6a9" }
[tool.uv.build-backend]
module-root = ""


[[tool.uv.dependency-metadata]]
name = "deep-gemm"
version = "2.8.2"
requires-dist = []
[[tool.uv.dependency-metadata]]
name = "flash-mla"
version = "1.0.0"
requires-dist = []
[[tool.uv.dependency-metadata]]
name = "deep-select"
version = "1.0.0"
requires-dist = []

[tool.uv.extra-build-dependencies]
deep-gemm = [{ requirement = "torch", match-runtime = true }, "setuptools==80.9.0", "packaging>=24", "wheel==0.45.1", "pybind11==3.0.1", "tree-sitter==0.26.0", "tree-sitter-cpp==0.23.4"]
flash-mla = [{ requirement = "torch", match-runtime = true }, "triton==3.7.1", "setuptools==80.9.0", "wheel==0.45.1", "ninja>=1.11", "packaging>=24"]
deep-select = [{ requirement = "torch", match-runtime = true }, "triton==3.7.1", "setuptools==80.9.0", "wheel==0.45.1", "ninja>=1.11", "packaging>=24"]
[tool.uv.extra-build-variables]
deep-gemm = { DG_USE_LOCAL_VERSION = "0", DG_FORCE_BUILD = "1" }
deep-select = { DEEP_SELECT_BUILD_TARGET_PLATFORM = "CUDA", MAX_JOBS = "4", NVCC_THREADS = "4" }
flash-mla = { FLASH_MLA_BUILD_TARGET_PLATFORM = "CUDA", FLASH_MLA_SKIP_REG_SPILL_CHECK = "1", MAX_JOBS = "4", NVCC_THREADS = "4" }
