# Adapted for OrbitInfer; see NOTICE and docs/source-import.md.
[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "orbitinfer-models-cuda"
version = "0.1.0.dev1"
description = "Optimized LLM implementations for OrbitInfer, in CUDA"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "orbitinfer_models_cuda/deepseek_v41/LICENSE", "orbitinfer_models_cuda/deepseek_v41/upstream/LICENSE", "orbitinfer_models_cuda/glm5_3_flash/LICENSE.fla"]
dependencies = [
  "orbitinfer[cuda]==0.1.0.dev1",
  "orbitinfer-models-torch==0.1.0.dev1",
  "huggingface-hub>=0.35",
  "pillow>=10",
  "safetensors>=0.5",
  "transformers>=5.14.1",
  # The optimized kernels are tested as one compatibility stack.
  "torch==2.13.0",
  "torchvision==0.28.0",
  "triton==3.7.1; sys_platform == 'linux'",
  "tilelang==0.1.14; sys_platform == 'linux'",
  "flashinfer-python==0.7.1; sys_platform == 'linux'",
  "flash-attn-4==4.0.0b26; sys_platform == 'linux'",
  "flash-linear-attention==0.5.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl==4.6.2; sys_platform == 'linux'",
  "nvidia-cutlass-dsl-libs-base==4.6.2; sys_platform == 'linux'",
  "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
  "cuda-tile==1.5.0; sys_platform == 'linux'",
  "quack-kernels==0.6.4; sys_platform == 'linux'",
  "deep-gemm==2.8.2; sys_platform == 'linux'",
  "deep-select==1.0.0; sys_platform == 'linux'",
  "flash-mla==1.0.0; sys_platform == 'linux'",
  "tile-kernels==1.0.0; sys_platform == 'linux'",
]

[tool.uv.sources]
orbitinfer = { workspace = true }
orbitinfer-models-torch = { workspace = true }
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", rev = "1fc9c66975ee322d628b3288534ca0e9ce12a64d" }
deep-select = { git = "https://github.com/deepseek-ai/DeepSelect", rev = "bfa4507d935f17ebfc3d0f00ff7d3c9a4d0e5c18" }
flash-mla = { git = "https://github.com/deepseek-ai/FlashMLA", rev = "2e5429fc5653bab6e081f09477126f731882a6a9" }

[tool.uv.build-backend]
module-root = ""
