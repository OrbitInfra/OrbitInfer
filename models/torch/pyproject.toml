# Adapted for OrbitInfer; see NOTICE and docs/source-import.md.
[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "orbitinfer-models-torch"
version = "0.1.0.dev1"
description = "Reference LLM implementations for OrbitInfer, in PyTorch"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "orbitinfer==0.1.0.dev1",
  "torch>=2.7",
  "huggingface-hub>=0.35",
  "safetensors>=0.5",
]

[tool.uv.sources]
orbitinfer = { workspace = true }

[tool.uv.build-backend]
module-root = ""
