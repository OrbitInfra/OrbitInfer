# Adapted for OrbitInfer; see NOTICE and docs/source-import.md.
[build-system]
requires = [
  "setuptools>=80",
  "cmake>=3.25; sys_platform == 'darwin'",
  "mlx==0.32.4; sys_platform == 'darwin'",
  "nanobind==3.1.0; sys_platform == 'darwin'",
]
build-backend = "setuptools.build_meta"

[project]
name = "orbitinfer-models-mlx"
version = "0.1.0.dev1"
description = "Apple Silicon (MLX) model runners for OrbitInfer"
readme = "orbitinfer_models_mlx/qwen3_5/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "orbitinfer_models_mlx/qwen3_5/LICENSE"]
dependencies = [
  "orbitinfer==0.1.0.dev1",
  # Native primitives use the MLX C++ ABI, so build and runtime must match.
  "mlx==0.32.4; sys_platform == 'darwin'",
  "mlx-lm>=0.32.2; sys_platform == 'darwin'",
  "mlx-vlm==0.7.11; sys_platform == 'darwin'",
  "huggingface-hub>=0.35",
]

[tool.uv.sources]
orbitinfer = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["orbitinfer_models_mlx*"]
namespaces = false

[tool.setuptools.package-data]
orbitinfer_models_mlx = [
  "*.pyi",
  "_native/*.cpp",
  "_native/*.metal",
  "_native/*.h",
  "_native/*.md",
  "_native/LICENSE*",
  "qwen3_5/README.md",
  "qwen3_5/LICENSE",
]
