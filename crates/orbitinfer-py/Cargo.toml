# Adapted from Resin a1989594 for OrbitInfer; changes: docs/source-import.md.
[package]
name = "orbitinfer-py"
version = "0.1.0-dev.1"
edition = "2024"
publish = false
rust-version = "1.96"
license = "Apache-2.0"
description = "Python bindings for the OrbitInfer inference engine"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311", "experimental-inspect"] }
pythonize = "0.29"
rayon = "1.12"
orbitinfer-core = { path = "../orbitinfer-core" }
orbitinfer-http = { path = "../orbitinfer-http" }
orbitinfer-recipe = { path = "../orbitinfer-recipe" }
rkyv.workspace = true
serde.workspace = true
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
