# Adapted for OrbitInfer; see NOTICE and docs/source-import.md.
[package]
name = "orbitinfer-http"
version = "0.1.0-dev.1"
edition = "2024"
publish = false
rust-version = "1.96"
license = "Apache-2.0"
description = "HTTP protocol adapters for the OrbitInfer inference engine"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
futures-core = "0.3"
prometheus-client.workspace = true
prost.workspace = true
orbitinfer-core = { path = "../orbitinfer-core" }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
